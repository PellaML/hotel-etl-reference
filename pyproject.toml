[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-etl-reference"
version = "0.1.0"
description = "A synthetic, testable hotel availability API-to-warehouse reference"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "openapi-spec-validator==0.9.0",
    "openapi-schema-validator>=0.9,<0.10",
    "jsonschema>=4.26,<5",
    "jsonschema-path>=0.5,<0.6",
    "referencing>=0.37,<0.38",
]

[project.scripts]
hotel-etl = "hotel_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/hotel_etl"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
