name: Verify reference
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.4
      - run: uv sync --locked --all-extras --python "${{ matrix.python }}"
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras mypy
      - run: uv run --locked --all-extras pytest --cov=hotel_etl --cov-branch --cov-fail-under=95 --cov-report=term-missing
      - run: uv run --locked --all-extras python -m hotel_etl demo --output-dir output/ci-demo
